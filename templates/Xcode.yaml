bundleIds: [com.apple.dt.Xcode]
args: one

captureArguments:
  appleScript: |
    set targetWindowInfo to {{windowInfo}}

    tell application id {{bundleId}}
        try
            set workspaceDocument to document of window id (windowID of targetWindowInfo)
            if class of workspaceDocument is not workspace document then return {}
            set workspacePath to path of workspaceDocument
            return {POSIX path of workspacePath}
        on error
            return {}
        end try
    end tell

resolveWindow:
  appleScript: |
    set targetPath to {{arg}}
    set candidateWindowInfos to {{candidateWindows}}
    
    if targetPath is "" then return missing value
    
    tell application id {{bundleId}}
        repeat with candidateWindowInfoRef in candidateWindowInfos
            set candidateWindowInfo to contents of candidateWindowInfoRef
            set candidateID to windowID of candidateWindowInfo as integer
            try
                set workspaceDocument to document of window id candidateID
                if class of workspaceDocument is workspace document then
                    set workspacePath to path of workspaceDocument
                    if (POSIX path of workspacePath) is targetPath then return candidateID
                end if
            end try
        end repeat
    end tell
    
    return missing value

launchApplication:
  shell: |
    targetArgs={{args}}
    open -b {{bundleId}} "${targetArgs[@]}"

openNewWindow:
  appleScript: |
    tell application id {{bundleId}}
        set targetPath to {{arg}}
        if length of targetPath > 0 then
            try
                open (POSIX file targetPath)
            end try
        else
            set windowCount to count of windows
            repeat with i from 1 to windowCount
                set windowInfo to (get properties of window i)
                if document of windowInfo is not missing value then
                    return id of windowInfo
                end if
            end repeat
        end if
    end tell

