bundleIds:
  - com.google.Chrome
  - com.google.Chrome.beta
  - com.google.Chrome.dev
  - com.google.Chrome.canary
  - org.chromium.Chromium
  - com.microsoft.edgemac
  - com.microsoft.edgemac.Beta
  - com.microsoft.edgemac.Dev
  - com.microsoft.edgemac.Canary
  - app.zen-browser.zen
  - com.vivaldi.Vivaldi
  - com.vivaldi.Vivaldi.snapshot
  - com.operasoftware.Opera
  - com.operasoftware.OperaGX
  - com.duckduckgo.macos.browser
  - com.kagi.kagimacOS
  - com.kagi.kagimacOS.RC
  - company.thebrowser.dia
  - company.thebrowser.Browser
  - com.brave.Browser
  - com.brave.Browser.beta
  - com.brave.Browser.nightly
args: many

captureArguments:
  appleScript: |
    set targetWindowInfo to {{windowInfo}}
    set targetBounds to appleScriptBounds of targetWindowInfo

    on boundsDistance(firstBounds, secondBounds)
        set totalDistance to 0
        repeat with boundsIndex from 1 to 4
            set difference to (item boundsIndex of firstBounds) - (item boundsIndex of secondBounds)
            if difference < 0 then set difference to 0 - difference
            set totalDistance to totalDistance + difference
        end repeat
        return totalDistance
    end boundsDistance

    tell application id {{bundleId}}
        set targetWindow to missing value
        set bestDistance to missing value
        repeat with candidateWindow in windows
            try
                set candidateBounds to bounds of candidateWindow
                set candidateDistance to my boundsDistance(candidateBounds, targetBounds)
                if bestDistance is missing value then
                    set bestDistance to candidateDistance
                    set targetWindow to contents of candidateWindow
                else if candidateDistance < bestDistance then
                    set bestDistance to candidateDistance
                    set targetWindow to contents of candidateWindow
                end if
            end try
        end repeat

        if targetWindow is missing value then return {}

        set tabURLs to {}
        repeat with browserTab in tabs of targetWindow
            set tabURL to URL of browserTab
            if tabURL is not missing value then set end of tabURLs to tabURL
        end repeat
        return tabURLs
    end tell

resolveWindow:
  appleScript: |
    use framework "Foundation"

    property ca : current application

    on normalizedHost(rawURL)
        set value to rawURL as text
        if value does not contain "://" then set value to "https://" & value
        set parsedURL to ca's NSURL's URLWithString:value
        if parsedURL is missing value then return ""
        set valueHost to parsedURL's host()
        if valueHost is missing value then return ""
        set lowerHost to valueHost's lowercaseString()
        return lowerHost as text
    end normalizedHost

    on containsAll(targetHosts, liveHosts)
        repeat with targetRef in targetHosts
            if (contents of targetRef) is not in liveHosts then return false
        end repeat
        return true
    end containsAll

    on boundsDistance(firstBounds, secondBounds)
        set totalDistance to 0
        repeat with boundsIndex from 1 to 4
            set difference to (item boundsIndex of firstBounds) - (item boundsIndex of secondBounds)
            if difference < 0 then set difference to 0 - difference
            set totalDistance to totalDistance + difference
        end repeat
        return totalDistance
    end boundsDistance

    set targetHosts to {}
    repeat with targetRef in {{args}}
        set targetHost to my normalizedHost(contents of targetRef)
        if targetHost is not "" then set end of targetHosts to targetHost
    end repeat

    if (count of targetHosts) is 0 then return missing value

    set candidateWindowInfos to {{candidateWindows}}
    if (count of candidateWindowInfos) is 0 then return missing value

    set bestDistance to missing value
    set matchedWindowID to missing value

    tell application id {{bundleId}}
        repeat with candidateWindow in windows
            try
                set liveHosts to {}

                repeat with browserTab in tabs of candidateWindow
                    set tabURL to URL of browserTab
                    if tabURL is not missing value then
                        set tabHost to my normalizedHost(tabURL)
                        if tabHost is not "" then set end of liveHosts to tabHost
                    end if
                end repeat

                if my containsAll(targetHosts, liveHosts) then
                    set liveWindowBounds to bounds of candidateWindow
                    repeat with candidateWindowInfoRef in candidateWindowInfos
                        set candidateWindowInfo to contents of candidateWindowInfoRef
                        set candidateBounds to appleScriptBounds of candidateWindowInfo
                        set candidateDistance to my boundsDistance(liveWindowBounds, candidateBounds)
                        if bestDistance is missing value then
                            set bestDistance to candidateDistance
                            set matchedWindowID to windowID of candidateWindowInfo
                        else if candidateDistance < bestDistance then
                            set bestDistance to candidateDistance
                            set matchedWindowID to windowID of candidateWindowInfo
                        end if
                    end repeat
                end if
            end try
        end repeat
    end tell

    return matchedWindowID

launchApplication:
  appleScript: |
    tell application id {{bundleId}}
        activate
        delay 1
        repeat with attempt from 1 to 30
            if (count of windows) > 0 then exit repeat
            delay 0.1
        end repeat
        if (count of windows) = 0 then error "Browser did not open a window." number -1728
        set targetWindow to front window
        set existingURLs to URL of every tab of targetWindow
        set missingURLs to my missingTabURLs({{args}}, existingURLs)
        repeat with targetURL in missingURLs
            tell targetWindow to make new tab at end of tabs with properties {URL:(contents of targetURL)}
        end repeat
    end tell

    on missingTabURLs(targetURLs, existingURLs)
        set knownURLs to existingURLs & {}
        set pendingURLs to {}
        considering case
            repeat with targetURL in targetURLs
                set candidateURL to contents of targetURL
                if candidateURL is not in knownURLs then
                    set end of pendingURLs to candidateURL
                    set end of knownURLs to candidateURL
                end if
            end repeat
        end considering
        return pendingURLs
    end missingTabURLs

openNewWindow:
  appleScript: |
    tell application id {{bundleId}}
        activate
        set targetWindow to make new window
        delay 1
        repeat with attempt from 1 to 30
            if (count of windows) > 0 then exit repeat
            delay 0.1
        end repeat
        if (count of windows) = 0 then error "Browser did not open a window." number -1728
        set existingURLs to URL of every tab of targetWindow
        set missingURLs to my missingTabURLs({{args}}, existingURLs)
        repeat with targetURL in missingURLs
            tell targetWindow to make new tab at end of tabs with properties {URL:(contents of targetURL)}
        end repeat
    end tell

    on missingTabURLs(targetURLs, existingURLs)
        set knownURLs to existingURLs & {}
        set pendingURLs to {}
        considering case
            repeat with targetURL in targetURLs
                set candidateURL to contents of targetURL
                if candidateURL is not in knownURLs then
                    set end of pendingURLs to candidateURL
                    set end of knownURLs to candidateURL
                end if
            end repeat
        end considering
        return pendingURLs
    end missingTabURLs

