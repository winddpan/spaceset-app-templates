bundleIds: [com.apple.finder]
args: one

captureArguments:
  appleScript: |
    set targetWindowInfo to {{windowInfo}}

    tell application id {{bundleId}}
        try
            set finderTarget to target of Finder window id (windowID of targetWindowInfo)
            return {POSIX path of (finderTarget as alias)}
        on error
            return {}
        end try
    end tell

resolveWindow:
  appleScript: |
    set targetPath to {{arg}}
    set candidateWindowInfos to {{candidateWindows}}
    
    if targetPath is "" then return missing value
    
    tell application id {{bundleId}}
        repeat with candidateWindowInfoRef in candidateWindowInfos
            set candidateWindowInfo to contents of candidateWindowInfoRef
            set candidateID to windowID of candidateWindowInfo as integer
            try
                set finderTarget to target of Finder window id candidateID
                set candidatePath to POSIX path of (finderTarget as alias)
                if candidatePath is targetPath then return candidateID
            end try
        end repeat
    end tell
    
    return missing value

launchApplication:
  shell: |
    targetArgs={{args}}
    open -b {{bundleId}} "${targetArgs[@]}"

openNewWindow:
  appleScript: |
    tell application id {{bundleId}}
        set targetPath to {{arg}}
        if length of targetPath > 0 then
            set targetFolder to POSIX file targetPath as alias
            set newWindow to make new Finder window to targetFolder
        else
            set newWindow to make new Finder window
        end if
        set toolbar visible of newWindow to true
        activate
        return id of newWindow
    end tell

